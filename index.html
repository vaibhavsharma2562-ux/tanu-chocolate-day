<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanya ❤️ | From Vaibhav</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#140909;
font-family:'Poppins',sans-serif;
color:#fbe9dc;
text-align:center;
overflow-x:hidden;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* Start Screen */
#startScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10000;
color:white;
}

section{
display:none;
padding:80px 20px;
max-width:900px;
margin:auto;
}

h1,h2{
font-family:'Playfair Display',serif;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
background:#ff8c7a;
color:white;
cursor:pointer;
margin-top:20px;
}

/* 3D Cube */
.cube-container{
width:260px;
height:260px;
margin:40px auto;
perspective:1000px;
}
.cube{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
animation:rotate 20s infinite linear;
}
.cube div{
position:absolute;
width:260px;
height:260px;
}
.cube img{
width:100%;
height:100%;
object-fit:cover;
border-radius:15px;
}
.front{transform:rotateY(0deg) translateZ(130px);}
.back{transform:rotateY(180deg) translateZ(130px);}
.right{transform:rotateY(90deg) translateZ(130px);}
.left{transform:rotateY(-90deg) translateZ(130px);}
.top{transform:rotateX(90deg) translateZ(130px);}
.bottom{transform:rotateX(-90deg) translateZ(130px);}

@keyframes rotate{
from{transform:rotateX(0) rotateY(0);}
to{transform:rotateX(360deg) rotateY(360deg);}
}

/* Slideshow */
.slide{display:none;}
.slide img{
width:100%;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<!-- Start Screen -->
<div id="startScreen">
<h1>Vaibhav ❤️ Tanya</h1>
<p>Tap To Begin</p>
<button onclick="startStory()">Enter</button>
</div>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Section 1 -->
<section id="intro">
<h1>For Tanya ❤️</h1>
<p>
You entered my life quietly.<br>
And everything changed.<br>
If love means choosing someone daily —<br>
I choose you. Always.
</p>
<button onclick="showCube()">Next</button>
</section>

<!-- Section 2 -->
<section id="cubeSection">
<h2>Our Love In 3D</h2>
<div class="cube-container">
<div class="cube">
<div class="front"><img src="pic1.jpg.jpeg"></div>
<div class="back"><img src="pic2.jpg.jpeg"></div>
<div class="right"><img src="pic3.jpg.jpeg"></div>
<div class="left"><img src="pic4.jpg.jpeg"></div>
<div class="top"><img src="pic5.jpg.jpeg"></div>
<div class="bottom"><img src="pic6.jpg.jpeg"></div>
</div>
</div>
<button onclick="showSlideshow()">Next</button>
</section>

<!-- Section 3 -->
<section id="slideshowSection">
<h2>Our Journey</h2>

<div class="slide"><img src="pic7.jpg.jpeg"></div>
<div class="slide"><img src="pic8.jpg.jpeg"></div>
<div class="slide"><img src="pic9.jpg.jpeg"></div>
<div class="slide"><img src="pic10.jpg.jpeg"></div>
<div class="slide"><img src="pic11.jpg.jpeg"></div>
<div class="slide"><img src="pic12.jpg.jpeg"></div>
<div class="slide"><img src="pic13.jpg.jpeg"></div>
<div class="slide"><img src="pic14.jpg.jpeg"></div>
<div class="slide"><img src="pic15.jpg.jpeg"></div>
<div class="slide"><img src="pic16.jpg.jpeg"></div>
<div class="slide"><img src="pic17.jpg.jpeg"></div>
<div class="slide"><img src="pic18.jpg.jpeg"></div>
<div class="slide"><img src="pic19.jpg.jpeg"></div>
<div class="slide"><img src="pic20.jpg.jpeg"></div>

<button onclick="nextSlide()">Next Image</button><br>
<button onclick="showFuture()">Continue</button>
</section>

<!-- Section 4 -->
<section id="futureSection">
<h2>Choose Our Future</h2>
<button onclick="showChoice('travel')">Travel The World 🌍</button>
<button onclick="showChoice('home')">Build Our Dream Home 🏡</button>
<p id="futureText"></p>
<button onclick="showFinal()">Next</button>
</section>

<!-- Section 5 -->
<section id="finalSection">
<h2>Tanya... Will You Always Be Mine? ❤️</h2>
</section>

<script>

let slideIndex = 0;
let slides = document.getElementsByClassName("slide");

function startStory(){
document.getElementById("bgMusic").play().catch(()=>{});
document.getElementById("startScreen").style.display="none";
document.getElementById("intro").style.display="block";
}

function showCube(){
document.getElementById("intro").style.display="none";
document.getElementById("cubeSection").style.display="block";
}

function showSlideshow(){
document.getElementById("cubeSection").style.display="none";
document.getElementById("slideshowSection").style.display="block";
showSlide();
}

function showSlide(){
for(let i=0;i<slides.length;i++){
slides[i].style.display="none";
}
slides[slideIndex].style.display="block";
}

function nextSlide(){
slideIndex++;
if(slideIndex>=slides.length){
slideIndex=0;
}
showSlide();
}

function showFuture(){
document.getElementById("slideshowSection").style.display="none";
document.getElementById("futureSection").style.display="block";
}

function showChoice(choice){
if(choice=="travel"){
document.getElementById("futureText").innerHTML="We explore the world — but home is wherever you are.";
}
if(choice=="home"){
document.getElementById("futureText").innerHTML="We build a peaceful world filled with love and chocolate.";
}
}

function showFinal(){
document.getElementById("futureSection").style.display="none";
document.getElementById("finalSection").style.display="block";
}

</script>

</body>
</html>
