<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chocolate Day ❤️ | Vaibhav & Tanya</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
color:#ffe8d6;
text-align:center;
overflow-x:hidden;
background:linear-gradient(-45deg,#1a0c0c,#2b0f0f,#3d1414,#1e0d0d);
background-size:400% 400%;
animation:gradientMove 15s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-2;
}

section{
display:none;
padding:60px 20px;
max-width:850px;
margin:auto;
opacity:0;
transition:opacity 1s ease;
}
section.show{
display:block;
opacity:1;
}

#startScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10000;
color:white;
}

h1,h2{
font-family:'Playfair Display',serif;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
background:#ff8c7a;
color:white;
cursor:pointer;
margin-top:25px;
}

#typeText{
white-space:pre-line;
line-height:1.8;
font-size:18px;
}

/* Floating hearts */
.heart{
position:fixed;
color:#ff8c7a;
font-size:18px;
animation:floatUp 8s linear forwards;
opacity:0.6;
z-index:-1;
}
@keyframes floatUp{
from{transform:translateY(100vh);}
to{transform:translateY(-10vh);}
}

/* Image rain */
.fallImg{
position:fixed;
width:60px;
height:60px;
object-fit:cover;
border-radius:10px;
animation:fall 7s linear forwards;
opacity:0.6;
z-index:-1;
}
@keyframes fall{
from{transform:translateY(-100px);}
to{transform:translateY(110vh);}
}

/* Slideshow */
.slide{display:none;}
.slide img{
width:100%;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

/* Kiss animation */
.kiss{
font-size:80px;
animation:kissMove 2s ease forwards;
}
@keyframes kissMove{
0%{transform:scale(0.5);opacity:0;}
100%{transform:scale(1);opacity:1;}
}

/* Explosion */
.explode{
position:fixed;
font-size:25px;
animation:burst 2s linear forwards;
}
@keyframes burst{
from{transform:translateY(0);}
to{transform:translateY(-100vh);}
}

/* Forever glow */
#foreverText{
font-size:42px;
margin-top:40px;
opacity:0;
animation:glow 2s infinite alternate;
}
@keyframes glow{
from{text-shadow:0 0 10px #ff8c7a;}
to{text-shadow:0 0 25px #ffb3a7;}
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<canvas id="fireworks"></canvas>

<div id="startScreen">
<h1>Vaibhav ❤️ Tanya</h1>
<p>Tap To Begin Our Chocolate Story</p>
<button onclick="startStory()">Enter</button>
</div>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<audio id="typeSound" src="https://assets.mixkit.co/sfx/preview/mixkit-typewriter-soft-click-1125.mp3"></audio>

<section id="messageSection">
<h1>Happy Chocolate Day Tanya 🍫❤️</h1>
<p id="typeText"></p>
<button onclick="showSlideshow()">Continue</button>
</section>

<section id="slideshowSection">
<h2>Our Sweet Memories</h2>
<div id="slidesContainer"></div>
<button onclick="showQuiz()">Continue</button>
</section>

<section id="quizSection">
<h2>Chocolate Love Quiz 💌</h2>
<p id="question"></p>
<div id="options"></div>
<p id="scoreText"></p>
<button onclick="nextQuestion()">Next</button>
</section>

<section id="futureSection">
<h2>Our Future 🍫✨</h2>
<p id="futureText"></p>
<button onclick="showFinal()">Continue</button>
</section>

<section id="finalSection">
<div class="kiss">🍫💋🍫</div>
<p id="finalMessage"></p>
<div id="foreverText">Vaibhav ❤️ Tanya Forever</div>
</section>

<script>

/* Moving Stars */
let canvas=document.getElementById("stars");
let ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
let stars=[];
for(let i=0;i<200;i++){
stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2});
}
function drawStars(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";
stars.forEach(s=>{
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
});
requestAnimationFrame(drawStars);
}
drawStars();

/* Start */
function startStory(){
document.getElementById("bgMusic").play().catch(()=>{});
document.getElementById("startScreen").style.display="none";
showSection("messageSection");
startHearts();
startImageRain();
typeWriter();
}

/* Smooth section */
function showSection(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("show"));
document.getElementById(id).classList.add("show");
}

/* Long emotional message */
let message=`Like chocolate melting slowly in warmth,
you entered my life and made everything softer.

You didn’t just add sweetness.
You added meaning.

You turned ordinary days into memories.
You turned silence into comfort.
You turned chaos into calm.

When I think of chocolate,
I think of richness.
Depth.
Warmth.

And when I think of you,
I feel the same things.

You are the quiet strength behind my smile.
The calm behind my storms.
The warmth behind my winters.

On this Chocolate Day,
I celebrate you.
I choose you.
Today, tomorrow, and always.`;

let i=0;
function typeWriter(){
if(i<message.length){
document.getElementById("typeText").innerHTML+=message.charAt(i);
document.getElementById("typeSound").play().catch(()=>{});
i++;
setTimeout(typeWriter,55);
}
}

/* Floating hearts */
function startHearts(){
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),8000);
},1200);
}

/* Image rain */
function startImageRain(){
setInterval(()=>{
let img=document.createElement("img");
let random=Math.floor(Math.random()*20)+1;
img.src="pic"+random+".jpg.jpeg";
img.className="fallImg";
img.style.left=Math.random()*100+"vw";
document.body.appendChild(img);
setTimeout(()=>img.remove(),7000);
},1500);
}

/* Slideshow auto */
let slideIndex=0;
let slides=[];
function showSlideshow(){
showSection("slideshowSection");
let container=document.getElementById("slidesContainer");
container.innerHTML="";
for(let i=1;i<=20;i++){
let div=document.createElement("div");
div.className="slide";
div.innerHTML=`<img src="pic${i}.jpg.jpeg">`;
container.appendChild(div);
}
slides=document.getElementsByClassName("slide");
autoSlide();
}

function autoSlide(){
for(let i=0;i<slides.length;i++){
slides[i].style.display="none";
}
slides[slideIndex].style.display="block";
slideIndex++;
if(slideIndex<slides.length){
setTimeout(autoSlide,3000);
}
}

/* Quiz */
let questions=[
{q:"Who loves Tanya the most?",options:["Vaibhav ❤️","Someone Else"],answer:0},
{q:"Chocolate + Tanya equals?",options:["Sweetest Combo ❤️","Normal"],answer:0},
{q:"Vaibhav chooses Tanya for?",options:["Today","Forever ❤️"],answer:1},
{q:"Tanya’s smile feels like?",options:["Sunshine ❤️","Homework"],answer:0},
{q:"Best partner award goes to?",options:["Tanya ❤️","Nobody"],answer:0}
];

let currentQuestion=0;
let score=0;

function showQuiz(){
showSection("quizSection");
loadQuestion();
}

function loadQuestion(){
let q=questions[currentQuestion];
document.getElementById("question").innerHTML=q.q;
let html="";
q.options.forEach((opt,i)=>{
html+=`<button onclick="checkAnswer(${i})">${opt}</button><br>`;
});
document.getElementById("options").innerHTML=html;
document.getElementById("scoreText").innerHTML="Score: "+score+"/"+questions.length;
}

function checkAnswer(i){
if(i==questions[currentQuestion].answer){
score++;
alert("Correct ❤️");
}else{
alert("Nice try 😉");
}
}

function nextQuestion(){
currentQuestion++;
if(currentQuestion>=questions.length){
showFuture();
return;
}
loadQuestion();
}

/* Future */
function showFuture(){
showSection("futureSection");
document.getElementById("futureText").innerHTML=
"I imagine us years from now — still laughing, still choosing each other, still finding sweetness in the smallest things.";
}

/* Final sure kiss */
function showFinal(){
showSection("finalSection");
document.getElementById("finalMessage").innerHTML=
"Tanya, you are my sweetness, my calm, my forever. Happy Chocolate Day ❤️";
document.getElementById("foreverText").style.opacity="1";
explode();
fireworks();
}

/* Explosion */
function explode(){
for(let i=0;i<60;i++){
let h=document.createElement("div");
h.className="explode";
h.innerHTML="🍫";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),2000);
}
}

/* Fireworks */
let fw=document.getElementById("fireworks");
let fwCtx=fw.getContext("2d");
fw.width=window.innerWidth;
fw.height=window.innerHeight;

function fireworks(){
for(let i=0;i<80;i++){
let x=Math.random()*fw.width;
let y=Math.random()*fw.height/2;
fwCtx.beginPath();
fwCtx.arc(x,y,3,0,Math.PI*2);
fwCtx.fillStyle="#ff8c7a";
fwCtx.fill();
}
setTimeout(()=>fwCtx.clearRect(0,0,fw.width,fw.height),800);
}

</script>

</body>
</html>
