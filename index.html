<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanya ❤️ | From Vaibhav</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#140909;
font-family:'Poppins',sans-serif;
color:#fbe9dc;
text-align:center;
overflow-x:hidden;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* Start Screen */
#startScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:10000;
}

/* Chocolate Drip */
.drip{
height:120px;
background:#3a1c1c;
position:relative;
}
.drip:after{
content:"";
position:absolute;
top:100%;
width:100%;
height:80px;
background:radial-gradient(circle at 20% 0,#3a1c1c 60px,transparent 61px),
radial-gradient(circle at 50% 0,#3a1c1c 50px,transparent 51px),
radial-gradient(circle at 80% 0,#3a1c1c 65px,transparent 66px);
background-repeat:no-repeat;
}

section{
padding:80px 20px;
max-width:900px;
margin:auto;
}

h1,h2{
font-family:'Playfair Display',serif;
}

/* 3D Cube */
.cube-container{
width:260px;
height:260px;
margin:50px auto;
perspective:1000px;
}
.cube{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
animation:rotate 25s infinite linear;
}
.cube div{
position:absolute;
width:260px;
height:260px;
}
.cube img{
width:100%;
height:100%;
object-fit:cover;
border-radius:15px;
}
.front{transform:rotateY(0deg) translateZ(130px);}
.back{transform:rotateY(180deg) translateZ(130px);}
.right{transform:rotateY(90deg) translateZ(130px);}
.left{transform:rotateY(-90deg) translateZ(130px);}
.top{transform:rotateX(90deg) translateZ(130px);}
.bottom{transform:rotateX(-90deg) translateZ(130px);}

@keyframes rotate{
from{transform:rotateX(0) rotateY(0);}
to{transform:rotateX(360deg) rotateY(360deg);}
}

/* Slideshow */
.slide{display:none;}
.slide img{
width:100%;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
background:#ff8c7a;
color:white;
cursor:pointer;
margin-top:20px;
}

.hearts{
position:fixed;
font-size:20px;
animation:float 6s linear infinite;
}
@keyframes float{
from{transform:translateY(100vh);}
to{transform:translateY(-10vh);}
}
</style>
</head>

<body>

<!-- Start Screen -->
<div id="startScreen">
<h1>Vaibhav ❤️ Tanya</h1>
<p>Tap to Begin Our Universe</p>
<button id="startBtn">Enter</button>
</div>

<canvas id="stars"></canvas>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="drip"></div>

<section>
<h1>For Tanya ❤️</h1>
<p>You entered my life quietly.  
And everything changed.  
If love means choosing someone daily —  
I choose you. Always.</p>
</section>

<section>
<h2>Our Love In 3D</h2>
<div class="cube-container">
<div class="cube">
<div class="front"><img src="pic1.jpg.jpeg"></div>
<div class="back"><img src="pic2.jpg.jpeg"></div>
<div class="right"><img src="pic3.jpg.jpeg"></div>
<div class="left"><img src="pic4.jpg.jpeg"></div>
<div class="top"><img src="pic5.jpg.jpeg"></div>
<div class="bottom"><img src="pic6.jpg.jpeg"></div>
</div>
</div>
</section>

<section>
<h2>Our Journey</h2>

<div class="slide"><img src="pic7.jpg.jpeg"></div>
<div class="slide"><img src="pic8.jpg.jpeg"></div>
<div class="slide"><img src="pic9.jpg.jpeg"></div>
<div class="slide"><img src="pic10.jpg.jpeg"></div>
<div class="slide"><img src="pic11.jpg.jpeg"></div>
<div class="slide"><img src="pic12.jpg.jpeg"></div>
<div class="slide"><img src="pic13.jpg.jpeg"></div>
<div class="slide"><img src="pic14.jpg.jpeg"></div>
<div class="slide"><img src="pic15.jpg.jpeg"></div>
<div class="slide"><img src="pic16.jpg.jpeg"></div>
<div class="slide"><img src="pic17.jpg.jpeg"></div>
<div class="slide"><img src="pic18.jpg.jpeg"></div>
<div class="slide"><img src="pic19.jpg.jpeg"></div>
<div class="slide"><img src="pic20.jpg.jpeg"></div>

</section>

<script>

/* Start Button */
const startBtn = document.getElementById("startBtn");
const startScreen = document.getElementById("startScreen");
const bgMusic = document.getElementById("bgMusic");

startBtn.addEventListener("click", function(){
bgMusic.play();
startScreen.style.opacity="0";
setTimeout(()=>{startScreen.style.display="none";},1000);
});

/* Slideshow */
let slideIndex=0;
showSlides();
function showSlides(){
let slides=document.getElementsByClassName("slide");
for(let i=0;i<slides.length;i++){
slides[i].style.display="none";
}
slideIndex++;
if(slideIndex>slides.length){slideIndex=1;}
slides[slideIndex-1].style.display="block";
setTimeout(showSlides,5000);
}

/* Chocolate rain */
setInterval(()=>{
let c=document.createElement("div");
c.className="hearts";
c.innerHTML="🍫";
c.style.left=Math.random()*100+"vw";
document.body.appendChild(c);
setTimeout(()=>c.remove(),6000);
},2000);

/* Stars background */
let canvas=document.getElementById("stars");
let ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
let stars=[];
for(let i=0;i<150;i++){
stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2});
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";
stars.forEach(s=>{
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
});
requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
